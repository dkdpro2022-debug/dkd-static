name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - "**"
    tags:
      - "stg-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'staging' || 'cloudflare-pages' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Select deploy target
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "DEPLOY_BRANCH=stg" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.87.0 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "$DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
